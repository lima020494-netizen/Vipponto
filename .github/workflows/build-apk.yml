name: Gerar APK Ponto Pro Gestao

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar configuracoes do Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: PontoProGestao-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
